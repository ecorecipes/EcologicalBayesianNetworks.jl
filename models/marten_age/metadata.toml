notes = "Original .dne as served by BNMA; the served filename 'Predicting Age of Martens From Capture Data.dne' has its spaces replaced by underscores and is otherwise unchanged. Age classification of Martes americana and M. caurina from capture and biological predictors: 7 chance nodes and 6 arcs after 2 CONSTANT nodes are skipped. The file is 2.4 MB because Netica stores the case data and node commentary alongside the small network. Its internal Netica name is marten_telomere_090812a_FINE_c, shared with the related telomere network of record 156 (CC-BY-NC-ND, fetch-only here as marten_telomere)."

