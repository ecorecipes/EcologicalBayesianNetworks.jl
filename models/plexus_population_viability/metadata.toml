retrieved = "2026-09-06"
sha256 = "b9f77d61c495188a4117423213c5406c306f7a726d7d1aa915bde27a278d5c8b"
notes = "Generalised BBN for evaluating wildlife population viability (B. G. Marcot, ICBEMP, alpha 1.0, 2000; Netica 5.00 export of 2011). 9 nature, 1 decision and 1 utility node; 7 CONSTANT nodes are skipped by the reader. Loading needs InfluenceDiagrams.jl. The nine chance nodes are Netica finding/equation nodes with evidence but no CPT, so the manifest sets allow_missing_tables = true and model_ir validates with BayesianNetworkFormats.validate(ir; allow_missing_tables = true)."

[parser_options]
