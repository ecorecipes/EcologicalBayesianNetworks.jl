fetch_instructions = "Download the .dne directly with fetch_model(name) (the server rejects some browser User-Agent strings but accepts the default Julia/curl one); or open https://www.plexuseco.com/The%20Plexus/bbns.htm, save the linked .dne, then import_model(name, path). Licence unstated, so the file is never committed."
citation = "Marcot, B. G., Holthausen, R. S., Raphael, M. G., Rowland, M. M. and Wisdom, M. J. (2001). Using Bayesian belief networks to evaluate fish and wildlife population viability under land management alternatives from an environmental impact statement. Forest Ecology and Management 153(1-3), 29-42. Model files from the Plexus Ecological Bayesian network collection."
doi = "10.1016/S0378-1127(01)00452-2"
licence = "unstated"
redistribution = "fetch-only"
has_decisions = true
has_utilities = true
