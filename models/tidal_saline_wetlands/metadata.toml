notes = "CC BY-ND: no derivatives, so the file is fetched into the cache only and never converted for redistribution. 18 chance nodes (3 CONSTANT nodes excluded). Two chance nodes (t, Denom) are Netica finding/equation nodes with evidence but no CPT, so the manifest sets allow_missing_tables = true and model_ir validates with BayesianNetworkFormats.validate(ir; allow_missing_tables = true); load_model leaves their mechanisms unbound. Several CPT rows sum to one only within 1e-7 (accepted by the reader, rejected by BayesianNetworks.validate at atol = 1e-8), so the manifest also sets renormalize = true."

