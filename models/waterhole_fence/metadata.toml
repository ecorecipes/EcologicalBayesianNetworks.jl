notes = "Original .dne as served by BNMA (served as 'Waterhole Fence.dne'; the space in the filename was replaced by an underscore, content unchanged). Teaching example of an expected-value decision network: 6 chance, 1 decision and 3 utility nodes; load_model returns an InfluenceDiagramModel. The Rainfall prior sums to one only within 5e-8, which the reader accepts (atol = 1e-6) but BayesianNetworks.validate does not (atol = 1e-8), so the manifest sets renormalize = true."

